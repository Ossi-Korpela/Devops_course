stages:
  - build
  - test
  - deploy

variables:
  #DOCKER_DRIVER: overlay2
  DOCKER_IMAGE_NAME: my-app
  DOCKER_IMAGE_TAG: stable

default:
  image: docker:stable

build:
  stage: build
  script:
    - echo "♥♥♥♥♥♥ building docker imgages"    
    - docker info
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG .


test:
  stage: test
  script:
    - echo "♥♥♥♥♥♥♥♥ running tests"
    - docker run --rm $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG python /app/tests/run_tests.py


deploy:
  stage: deploy
  services:
  script:
    - echo "♥♥♥♥♥ deploying the system"
    - docker-compose down || true
    - docker-compose up -d --build

  when: on_success




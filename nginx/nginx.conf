user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    upstream service1_upstream {
        server service1_1:8199;
        server service1_2:8199;
        server service1_3:8199;
    }

    server {
        listen 8198;

        auth_basic "Restricted Content";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            alias /usr/share/nginx/html/;
            index index.html;
        }
        location /api/ {
            rewrite ^/api(.*)$ /$1 break;
            proxy_pass http://service1_upstream/;
            auth_basic off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }
        location /stop {
            proxy_pass http://shutdown_service:8300/stop;
        }
        location /state {
             satisfy any;
             limit_except GET {
                auth_basic "Restricted Area";
             }
             auth_basic off;


             proxy_pass http://service1_backend;
             proxy_set_header Host $host;
             
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-Proto $scheme;
         }
         location /log {
              proxy_pass http://service1_backend;
              auth_basic off;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
         }



    }

    server {
        listen 8197;

        location / {
            proxy_pass http://api_gateway:8197;
        }
    }

    
}
version: '3.8'
services:
  nginx:
    build: ./nginx
    ports:
      - "8198:80"
      - "8197:80"
    depends_on:
      - service1_1
      - service1_2
      - service1_3
      - shutdown_service
    networks:
      - ex4-net

  service1_1:
    build: ./service1
    networks:
      - ex4-net
  service1_2:
    build: ./service1
    networks:
      - ex4-net
  service1_3:
    build: ./service1
    networks:
      - ex4-net

  service2:
    build: ./service2
    networks:
      - ex4-net


  shutdown_service:
    image: alpine
    command: sh -c "nc -l -p 8300 -e /shutdown.sh"
    volumes:
      - ./shutdown.sh:/shutdown.sh
    networks:
      - ex4-net



  #  test_runner:
  #    build: ./tests
  #    image: python:3.10
  #    working_dir: /app
  #    networks:
  #      - ex4-net
  #    depends_on:
  #      - nginx

networks:
  ex4-net:
    driver: bridge
version: '3.8'
services:
  nginx:
    build: ./nginx
    ports:
      - "8198:80"
      - "8197:80"
    depends_on:
      - service1_1
      - service1_2
      - service1_3
    networks:
      - ex4-net

  service1_1:
    build: ./service1
    networks:
      - ex4-net
    volumes: #we share the state in a shared volume
      - shared_data:/state
      - /var/run/docker.sock:/var/run/docker.sock
  service1_2:
    build: ./service1
    networks:
      - ex4-net
    volumes:
      - shared_data:/state
      - /var/run/docker.sock:/var/run/docker.sock
  service1_3:
    build: ./service1
    networks:
      - ex4-net
    volumes:
      - shared_data:/state
      - /var/run/docker.sock:/var/run/docker.sock

  service2:
    build: ./service2
    networks:
      - ex4-net


volumes:
  shared_data:

networks:
  ex4-net:
    driver: bridge